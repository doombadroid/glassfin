# App Store screenshots on an iPhone simulator, signed in to the public
# Jellyfin demo server (public-domain and Creative Commons films only).
# Run by .github/workflows/sim-screenshots.yml, which passes the item ids.
appId: com.doombadroid.glassfin
---
- launchApp:
    clearState: true
# A cold launch can take a while on the CI simulator.
- extendedWaitUntil:
    visible: "http(s)://your-server.com"
    timeout: 60000
- tapOn: "http(s)://your-server.com"
- inputText: "https://demo.jellyfin.org/stable"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Username"
    timeout: 30000
- tapOn: "Username"
- inputText: "demo"
- tapOn: "Log in"
# First launch shows the intro sheet over Home.
# The bottom-sheet library exposes the sheet as one "Bottom Sheet" element,
# so its text can't be matched: wait for that, tap Done by position.
- extendedWaitUntil:
    visible: "Bottom Sheet"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 00-intro
- tapOn:
    point: "50%,86%"
- extendedWaitUntil:
    visible: "Tonight"
    timeout: 15000
- swipe:
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-home

- openLink: "glassfin://items/page?id=${MOVIE_ID}"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 04-details

- openLink: "glassfin://series/${SERIES_ID}"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 05-series

- openLink: "glassfin://items/page?id=${MOVIE_ID}"
- waitForAnimationToEnd:
    timeout: 5000
# The play button in the details sheet (2m ▶).
- tapOn:
    point: "40%,64%"
# Let playback run: the video keeps animating, so this waits the full time.
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    point: "50%,45%"
# Let the controls fade in (the video itself never stops animating).
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: 07-player
