name: Simulator screenshots

# App Store screenshots for the standard iPhone sizes, taken in the newest
# Pro Max simulator on the public Jellyfin demo server. Manual only.
on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device type (falls back to the newest Pro Max)
        default: iPhone 18 Pro Max

concurrency:
  group: sim-screenshots
  cancel-in-progress: true

env:
  XCODE: '27.1'
  DEMO: https://demo.jellyfin.org/stable

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '${{ env.XCODE }}' }

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate project files
        run: bun run prebuild

      - name: Build for the simulator
        env:
          EXPO_TV: 0
        run: |
          bun scripts/ios/build-ios.ts --production --simulator --skip-credentials --configuration Release
          for t in $(find build -maxdepth 2 -name '*.tar.gz'); do tar -xzf "$t" -C build; done
          app=$(find build ~/Library/Developer/Xcode/DerivedData -path '*iphonesimulator*' -name 'Glassfin.app' -maxdepth 8 2>/dev/null | head -1)
          [ -n "$app" ] || app=$(find build -name '*.app' -maxdepth 3 | head -1)
          test -d "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Boot the simulator
        run: |
          want="${{ inputs.device }}"
          types=$(xcrun simctl list devicetypes -j)
          type=$(echo "$types" | python3 -c "import json,sys
          want=sys.argv[1]; t=json.load(sys.stdin)['devicetypes']
          exact=[d for d in t if d['name']==want]
          pm=[d for d in t if d['name'].startswith('iPhone') and d['name'].endswith('Pro Max')]
          print((exact or pm[-1:])[0]['identifier'])" "$want")
          runtime=$(xcrun simctl list runtimes -j | python3 -c "import json,sys
          r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]
          print(r[-1]['identifier'])")
          echo "device type $type, runtime $runtime"
          udid=$(xcrun simctl create shots "$type" "$runtime")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl install "$udid" "$APP"
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: Pick demo items
        run: |
          H='Authorization: MediaBrowser Client="Glassfin", Device="CI", DeviceId="glassfin-ci-shots", Version="1"'
          auth=$(curl -sf -X POST "$DEMO/Users/AuthenticateByName" -H 'Content-Type: application/json' -H "$H" -d '{"Username":"demo","Pw":""}')
          t=$(echo "$auth" | jq -r .AccessToken); u=$(echo "$auth" | jq -r .User.Id)
          q() { curl -sf "$DEMO/Items?userId=$u&Recursive=true&$1" -H "$H, Token=\"$t\""; }
          movie=$(q "IncludeItemTypes=Movie&SearchTerm=Gran%20Dillama" | jq -r '.Items[0].Id')
          series=$(q "IncludeItemTypes=Series&SearchTerm=Pioneer" | jq -r '.Items[0].Id')
          # Dracula (1931) is still under copyright: keep it off the home screen.
          drac=$(q "IncludeItemTypes=Movie&SearchTerm=Dracula" | jq -r '.Items[0].Id')
          [ "$drac" != null ] && curl -sf -X POST "$DEMO/UserPlayedItems/$drac?userId=$u" -H "$H, Token=\"$t\"" >/dev/null || true
          test "$movie" != null && test "$series" != null
          echo "MOVIE_ID=$movie" >> "$GITHUB_ENV"
          echo "SERIES_ID=$series" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Take the screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          maestro --device "$UDID" test .maestro/screenshots.yaml \
            -e OUT="$RUNNER_TEMP/shots" -e MOVIE_ID="$MOVIE_ID" -e SERIES_ID="$SERIES_ID"
          ls -la "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-screenshots
          path: |
            ${{ runner.temp }}/shots
            ~/.maestro/tests
          if-no-files-found: warn
